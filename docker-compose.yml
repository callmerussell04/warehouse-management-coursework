services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: redis_cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:postgres@db:5432/warehouse_db?sslmode=disable", "up"]

  warehouse_management_system_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse_management_system_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/warehouse_db?sslmode=disable
      HTTP_PORT: 8080
      REDIS_URL: redis:6379
      ALLOWED_ORIGINS: http://localhost
      TRUSTED_PROXIES: 172.30.50.254
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - default
      - proxy

  warehouse_management_system_frontend:
    build:
      context: ./frontend/warehouse-management-system
      dockerfile: Dockerfile
    container_name: warehouse_management_system_frontend
    networks:
      - proxy

  reverse_proxy:
    image: nginx:alpine
    container_name: warehouse_management_system_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - warehouse_management_system_backend
      - warehouse_management_system_frontend
    networks:
      proxy:
        ipv4_address: 172.30.50.254

volumes:
  postgres_data:
  redis_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.50.0/24
