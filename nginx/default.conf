upstream frontend {
    server warehouse_management_system_frontend:80;
}

upstream backend {
    server warehouse_management_system_backend:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/yaml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location ^~ /auth/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location = /health {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location = /docs {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location ^~ /docs/ {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location = /openapi.yml {
        include /etc/nginx/proxy_params;
        proxy_pass http://backend;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend;
    }
}
